name: Windows build and tests
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64
      - name: Build
        run: cmake --build build --config Release --target System1Bridge_VST3 System1ControlTest System1EditorCheck System1LibraryTest ReaderTest ClockTest ScopeTest --parallel 4
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Package
        shell: powershell
        run: ./scripts/package.ps1 -BuildDir build -JuceDir build/_deps/juce-src
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: system1-audio-bridge-windows-x64
          path: dist/*
          if-no-files-found: error
